# Goes under services: in the stack's docker-compose.yml, with the volume
# below added under its volumes:. The folder ./bedrock-api holds app.py,
# stations.txt and the Dockerfile of server/refinery.

  # ============================================================
  # Bedrock refinery observations (github.com/SC-Ravaxx/Bedrock, server/refinery)
  # ============================================================
  bedrock-api:
    build: ./bedrock-api
    container_name: bedrock-api
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - bedrock-api-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - forsaken-network

