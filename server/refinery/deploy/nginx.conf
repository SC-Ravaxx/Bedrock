# Three parts for the site's nginx configuration.

# 1. At http level, beside the other limit_req_zone lines: a report every
#    second on average from one address is far more than a player sends.
limit_req_zone $binary_remote_addr zone=bedrock_api:10m rate=60r/m;

# 2. In the server block of the-forsaken.org, above "location = /bedrock/".
#    The longer prefix wins over "location ^~ /bedrock/", so the update files
#    stay as they are. /bedrock/ is already left out of the user-agent filter.
    # ============================================================
    # Bedrock refinery observations (server/refinery in the Bedrock repo)
    # ============================================================
    location ^~ /bedrock/api/ {
        limit_req zone=bedrock_api burst=30 nodelay;
        limit_conn conn_limit 10;
        # a batch of rock scans may take 64 KB; the service holds a refinery
        # reading to 16 KB itself
        client_max_body_size 64k;
        # resolved per request through Docker's DNS, so nginx starts and
        # reloads even while the container is down
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $bedrock_api http://bedrock-api:8080;
        proxy_pass $bedrock_api;
        include /etc/nginx/conf.d/proxy-params.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cache-Control "no-store" always;
    }

# 3. Below it, in the same server block: where a bug report sends its debug
#    folder, a zip of up to 32 MiB (FEEDBACK_DEBUG_MAX in app.py; a larger
#    one nginx turns down itself). The longer prefix wins over the one
#    above and takes nothing from it, so every line of that one is here
#    again. Without the same proxy lines the service would not get
#    X-Real-IP, by which it tells what came from outside - and
#    /v1/feedback/export.csv, which is not for outside, lies under this
#    prefix too. (POST /v1/feedback itself, without the slash, stays with
#    the location above.)
    location ^~ /bedrock/api/v1/feedback/ {
        limit_req zone=bedrock_api burst=30 nodelay;
        limit_conn conn_limit 10;
        client_max_body_size 32m;
        # the longest pause an upload may make, not its whole time: a slow
        # line is no reason to break it off, two minutes of nothing are
        client_body_timeout 120s;
        # nginx takes the whole zip before it passes it on - its default,
        # said here because the upload counts on it. A slow or broken upload
        # stays with nginx, the service gets the zip in one piece and is
        # busy with it for a moment, and an upload that breaks off does not
        # use up its token. The price: room for the zip in nginx's
        # client_body_temp_path while it comes in, 32 MiB for each at a time.
        proxy_request_buffering on;
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $bedrock_api http://bedrock-api:8080;
        proxy_pass $bedrock_api;
        include /etc/nginx/conf.d/proxy-params.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cache-Control "no-store" always;
    }
