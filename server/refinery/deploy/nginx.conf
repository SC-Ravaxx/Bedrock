# Two parts for the site's nginx configuration.

# 1. At http level, beside the other limit_req_zone lines: a report every
#    second on average from one address is far more than a player sends.
limit_req_zone $binary_remote_addr zone=bedrock_api:10m rate=60r/m;

# 2. In the server block of the-forsaken.org, above "location = /bedrock/".
#    The longer prefix wins over "location ^~ /bedrock/", so the update files
#    stay as they are. /bedrock/ is already left out of the user-agent filter.
    # ============================================================
    # Bedrock refinery observations (server/refinery in the Bedrock repo)
    # ============================================================
    location ^~ /bedrock/api/ {
        limit_req zone=bedrock_api burst=30 nodelay;
        limit_conn conn_limit 10;
        client_max_body_size 16k;
        # resolved per request through Docker's DNS, so nginx starts and
        # reloads even while the container is down
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $bedrock_api http://bedrock-api:8080;
        proxy_pass $bedrock_api;
        include /etc/nginx/conf.d/proxy-params.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cache-Control "no-store" always;
    }
